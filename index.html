<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spice Street – Online Food Ordering</title>
<style>
:root{--bg:#fff8ef;--card:#ffffff;--ink:#2b1d14;--mute:#7a6556;--line:#ecdcc8;--accent:#c2410c;--accent-ink:#ffffff;--ok:#15803d;--err:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1410;--card:#291d16;--ink:#f6e9da;--mute:#b79d88;--line:#42312600;--line:#433226;--accent:#f97316;--accent-ink:#1c1410;--ok:#4ade80;--err:#f87171}}
:root[data-theme="dark"]{--bg:#1c1410;--card:#291d16;--ink:#f6e9da;--mute:#b79d88;--line:#433226;--accent:#f97316;--accent-ink:#1c1410;--ok:#4ade80;--err:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
h1,h2,h3,button,input,textarea,.price,.tag{font-family:"Trebuchet MS",Verdana,sans-serif}
header{padding:20px 16px 8px;max-width:1000px;margin:0 auto}
h1{margin:0;font-size:1.9rem}
header p{margin:4px 0 0;color:var(--mute)}
main{max-width:1000px;margin:0 auto;padding:8px 16px 40px;display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:820px){main{grid-template-columns:1.6fr 1fr;align-items:start}}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:1rem}
.controls input{flex:1 1 180px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;font-size:.9rem}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:110px;display:flex;align-items:center;justify-content:center;font-size:3.4rem;background:var(--line)}
.body{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.body h3{margin:0;font-size:1.05rem}
.body p{margin:0;color:var(--mute);font-size:.88rem;flex:1}
.tag{font-size:.78rem;color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.price{font-weight:700}
button{cursor:pointer;border:0;border-radius:8px;padding:9px 14px;font-size:.95rem;background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
aside{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
aside h2{margin:0 0 10px;font-size:1.2rem}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{padding:2px 10px}
.rm{background:none;color:var(--err);padding:2px 6px;font-size:.85rem}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;padding:12px 0}
.msg{padding:14px;border-radius:8px;text-align:center;color:var(--mute);border:1px dashed var(--line)}
.msg.ok{color:var(--ok);border-color:var(--ok);border-style:solid}
label{display:block;font-size:.88rem;margin:10px 0 4px;font-family:"Trebuchet MS",Verdana,sans-serif}
.err{color:var(--err);font-size:.82rem;min-height:1em;font-family:"Trebuchet MS",Verdana,sans-serif}
.summary{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.9rem;margin-bottom:10px}
.summary li{display:flex;justify-content:space-between}
.summary ul{list-style:none;margin:0;padding:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Spice Street</h1>
  <p>Browse, add to cart and order your favourite food.</p>
</header>
<main>
  <section aria-label="Menu">
    <h2 style="font-size:1rem;margin:4px 0 8px">Search food items by name</h2>
    <div class="controls">
      <input id="search" type="search" placeholder="Search food by name" aria-label="Search food by name">
    </div>
    <h2 style="font-size:1rem;margin:4px 0 8px">Filter food items by category</h2>
    <div class="chips" id="chips" style="margin-bottom:16px"></div>
    <div class="grid" id="menu"></div>
    <div class="msg" id="noResult" hidden>No dishes match your search or category.</div>
  </section>

  <aside aria-label="Cart">
    <h2>Your cart</h2>
    <div id="cart"></div>
    <div id="checkout" hidden>
      <div class="total"><span>Total</span><span id="total">₹0</span></div>
      <h2 style="font-size:1rem">Order summary</h2>
      <div class="summary"><ul id="summary"></ul></div>
      <label for="name">Name</label>
      <input id="name" autocomplete="name"><div class="err" id="e-name"></div>
      <label for="phone">Phone (10 digits)</label>
      <input id="phone" inputmode="numeric" maxlength="10" autocomplete="tel"><div class="err" id="e-phone"></div>
      <label for="addr">Delivery address</label>
      <textarea id="addr" rows="3"></textarea><div class="err" id="e-addr"></div>
      <button id="place" style="width:100%;margin-top:8px">Place order</button>
      <button id="clear" class="ghost" style="width:100%;margin-top:8px">Clear cart</button>
    </div>
    <div class="msg ok" id="done" hidden></div>
  </aside>
</main>

<script>
var FOODS=[
 {id:1,name:"Margherita Pizza",cat:"Pizza",price:249,img:"🍕",desc:"Cheese, tomato sauce and fresh basil."},
 {id:2,name:"Paneer Pizza",cat:"Pizza",price:299,img:"🍕",desc:"Paneer cubes, capsicum and onion."},
 {id:3,name:"Veg Burger",cat:"Burgers",price:129,img:"🍔",desc:"Crispy veg patty with lettuce and mayo."},
 {id:4,name:"Chicken Burger",cat:"Burgers",price:169,img:"🍔",desc:"Juicy chicken patty with cheese slice."},
 {id:5,name:"Chicken Biryani",cat:"Rice",price:199,img:"🍛",desc:"Seeraga samba rice with spiced chicken."},
 {id:6,name:"Veg Fried Rice",cat:"Rice",price:119,img:"🍚",desc:"Wok-tossed rice with fresh vegetables."},
 {id:7,name:"Masala Dosa",cat:"Tiffin",price:79,img:"🥞",desc:"Crisp dosa with potato masala and chutneys."},
 {id:8,name:"Idli Sambar",cat:"Tiffin",price:49,img:"🍚",desc:"Four soft idlis with hot sambar."},
 {id:9,name:"Cold Coffee",cat:"Drinks",price:89,img:"🥤",desc:"Chilled coffee with ice cream."},
 {id:10,name:"Fresh Lime Soda",cat:"Drinks",price:49,img:"🍹",desc:"Sweet or salt, your choice."}
];
var KEY="foodCart";
var cart={};          // {id: qty}
var cat="All";
var $=function(i){return document.getElementById(i)};
function load(){try{var s=localStorage.getItem(KEY);if(s)cart=JSON.parse(s)||{}}catch(e){cart={}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(cart))}catch(e){}}
function money(n){return "₹"+n}
function find(id){return FOODS.filter(function(f){return f.id==id})[0]}

function renderChips(){
  var cats=["All"].concat(FOODS.map(function(f){return f.cat}).filter(function(c,i,a){return a.indexOf(c)===i}));
  $("chips").innerHTML=cats.map(function(c){return '<button class="chip'+(c===cat?' on':'')+'" data-c="'+c+'">'+c+'</button>'}).join("");
}
function renderMenu(){
  var q=$("search").value.trim().toLowerCase();
  var list=FOODS.filter(function(f){return (cat==="All"||f.cat===cat)&&f.name.toLowerCase().indexOf(q)>-1});
  $("menu").innerHTML=list.map(function(f){
    return '<article class="item"><div class="pic" aria-hidden="true">'+f.img+'</div><div class="body"><span class="tag">'+f.cat+'</span><h3>'+f.name+'</h3><p>'+f.desc+'</p><div class="row"><span class="price">'+money(f.price)+'</span><button data-add="'+f.id+'">Add to cart</button></div></div></article>';
  }).join("");
  $("noResult").hidden=list.length>0;
}
function renderCart(){
  var ids=Object.keys(cart).filter(function(i){return cart[i]>0});
  var empty=ids.length===0;
  $("checkout").hidden=empty;
  if(empty){
    $("cart").innerHTML=$("done").hidden?'<div class="msg">Your cart is empty. Add some dishes from the menu.</div>':'';
    return;
  }
  var total=0,rows="",sum="";
  ids.forEach(function(i){
    var f=find(i),q=cart[i],sub=f.price*q;total+=sub;
    rows+='<div class="line"><div><strong>'+f.name+'</strong><div class="tag">'+money(f.price)+' each</div></div><div class="price">'+money(sub)+'</div>'+
      '<div class="qty"><button class="ghost" data-dec="'+i+'" aria-label="Decrease quantity">−</button><span>'+q+'</span><button class="ghost" data-inc="'+i+'" aria-label="Increase quantity">+</button></div>'+
      '<button class="rm" data-rm="'+i+'">Remove</button></div>';
    sum+='<li><span>'+f.name+' × '+q+'</span><span>'+money(sub)+'</span></li>';
  });
  $("cart").innerHTML=rows;
  $("summary").innerHTML=sum;
  $("total").textContent=money(total);
}
function add(id){cart[id]=(cart[id]||0)+1;$("done").hidden=true;save();renderCart()}
function dec(id){cart[id]=(cart[id]||0)-1;if(cart[id]<=0)delete cart[id];save();renderCart()}
function rm(id){delete cart[id];save();renderCart()}

$("chips").addEventListener("click",function(e){var c=e.target.getAttribute("data-c");if(c){cat=c;renderChips();renderMenu()}});
$("search").addEventListener("input",renderMenu);
$("menu").addEventListener("click",function(e){var i=e.target.getAttribute("data-add");if(i)add(i)});
$("cart").addEventListener("click",function(e){
  var t=e.target,a=t.getAttribute("data-inc"),b=t.getAttribute("data-dec"),c=t.getAttribute("data-rm");
  if(a)add(a);else if(b)dec(b);else if(c)rm(c);
});
$("clear").addEventListener("click",function(){cart={};save();renderCart()});
$("place").addEventListener("click",function(){
  var n=$("name").value.trim(),p=$("phone").value.trim(),a=$("addr").value.trim(),ok=true;
  $("e-name").textContent=n.length<3?(ok=false,"Enter your full name (at least 3 letters)."):"";
  $("e-phone").textContent=!/^[6-9]\d{9}$/.test(p)?(ok=false,"Enter a valid 10-digit mobile number."):"";
  $("e-addr").textContent=a.length<10?(ok=false,"Enter your full delivery address."):"";
  if(!ok)return;
  cart={};save();
  $("name").value=$("phone").value=$("addr").value="";
  $("done").hidden=false;
  $("done").textContent="Order placed! Thank you, "+n+". Your food is on the way.";
  renderCart();
});

load();renderChips();renderMenu();renderCart();
</script>
</body>
</html>
